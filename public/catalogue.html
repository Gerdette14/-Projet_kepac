<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalogue | KEPAC Boutique</title>
  <script src="js/tailwind-config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body class="min-h-screen antialiased text-slate-900">
  <header class="site-header">
    <nav class="nav">
      <a class="brand" href="index.html"><img class="brand-logo" src="images/kepac-logo.svg" alt="KEPAC Boutique"></a>
      <div class="nav-links"><a href="index.html">Accueil</a><a href="catalogue.html">Catalogue</a></div>
      <div class="nav-actions"><a class="btn btn-secondary" href="https://wa.me/qr/6VMOUHB2HLXTI1" target="_blank" rel="noopener">WhatsApp</a><a class="btn btn-primary" href="connexion.html">Admin</a></div>
    </nav>
  </header>
  <main class="section">
    <div class="container">
      <div class="section-head">
        <div><span class="eyebrow">Catalogue</span><h1>Produits disponibles</h1><p class="lead">Explorez les articles par univers : mode, chaussures et topographie, sans mélange inutile.</p></div>
        <span class="tag" data-result-count>0 produit</span>
      </div>
      <div class="catalog-segments" data-segment-tabs>
        <button class="segment-btn active" type="button" data-segment="Tous">Tous</button>
        <button class="segment-btn" type="button" data-segment="Mode">Vêtements & chaussures</button>
        <button class="segment-btn" type="button" data-segment="Topographie">Équipements topographiques</button>
      </div>
      <div class="catalog-layout">
        <aside class="filters">
          <div class="field"><label for="search">Recherche</label><input id="search" data-search placeholder="Nom, catégorie..."></div>
          <div class="field"><label for="category">Catégorie</label><select id="category" data-category><option>Tous</option><option>Vêtements</option><option>Chaussures</option><option>Topographie</option></select></div>
          <div class="field"><label for="sort">Tri</label><select id="sort" data-sort><option value="">Recommandé</option><option value="name">Nom A-Z</option></select></div>
        </aside>
        <section class="product-grid" data-catalog-products></section>
      </div>
    </div>
  </main>
  <script src="js/main.js?v=10"></script>
  <script src="js/produits.js?v=7"></script>
</body>
</html>
